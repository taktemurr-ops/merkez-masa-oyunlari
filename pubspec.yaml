dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve masa motoru sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 293a3eda102647b57c23e670d800d91b48d32f0b
  masa_motoru:
    git:
      url: https://github.com/taktemurr-ops/masa-motoru
      ref: 939eff2c81e509c57a51311fcc25f7ec44190fe2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#283593"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#283593"
    theme_color: "#283593"

flutter_native_splash:
  color: "#283593"
  image: assets/branding/splash.png
  android_12:
    color: "#283593"
    image: assets/branding/splash_android12.png
  web: true
